name: substation
description: "换流站运行事件链研判和专业文档问答领域。面向站内连续事件、告警、保护动作、故障穿越、阀冷、站用电、录波、控保切换和专业术语解释等场景，输出结构化结论和可追溯证据。回答必须区分用户提供的事件事实、文档依据和智能体推断；面向用户的最终回答不得暴露工具调用过程、工作流步骤、内部错误、自检文字或“已确认回复完整”。工具选择原则：事件链总结/异常性研判优先 assess_substation_event_chain；根据文档回答、术语解释、现象含义和处置依据优先 prepare_substation_answer_context；资料定位才用 search_substation_evidence；需要核对原文上下文才用 read_substation_evidence。不要把未在事件事实或文档中出现的状态说成已发生。"

tool_preferences:
  generic_search: fallback_only

excluded_tools:
  - start_workflow
  - apply_rule
  - apply_rule_batch

objects:
  StationEvent:
    kind: event
    data_source: user_provided
    mutability: append_only
    summary: "站内连续事件"
    description: "用户提供的二级/三级事件、SER、告警或操作记录。"
    source:
      type: runtime_memory
      id_field: event_id
    properties:
      event_id: {type: str, required: true, description: "事件编号"}
      station_name: {type: str, description: "站点名称"}
      device_name: {type: str, description: "设备或系统名称"}
      event_type: {type: str, description: "事件类型"}
      start_time: {type: str, description: "开始时间"}
      end_time: {type: str, description: "结束时间"}
      alarm_level: {type: int, description: "告警等级"}
      summary: {type: str, description: "二级摘要"}
      event_nature_text: {type: str, description: "原始事件性质"}
      subsystems: {type: str, description: "归一化子系统"}
      raw_text: {type: str, description: "用户输入中的原始事件片段；字段抽取不完整时作为主要事实源"}
      parse_quality: {type: str, description: "字段抽取质量: high/medium/low/raw"}

  EventChain:
    kind: event
    data_source: user_provided
    mutability: append_only
    summary: "同站连续事件链"
    description: "按时间组织的一组连续事件，用于研判主事件、伴随事件和异常信号。"
    source:
      type: runtime_memory
      id_field: chain_id
    properties:
      chain_id: {type: str, required: true, description: "链编号"}
      station_name: {type: str, description: "站点名称"}
      window_start: {type: str, description: "开始时间"}
      window_end: {type: str, description: "结束时间"}
      event_count: {type: int, description: "事件数量"}
      involved_subsystems: {type: str, description: "涉及子系统"}

  EventConclusion:
    kind: entity
    data_source: agent_generated
    mutability: append_only
    summary: "事件链结构化结论"
    description: "智能体对事件链的最终结构化结论，包含描述、类型、性质、风险等级和理由。"
    source:
      type: runtime_memory
      id_field: conclusion_id
    properties:
      conclusion_id: {type: str, required: true, description: "结论编号"}
      event_description: {type: str, required: true, description: "事件描述"}
      event_type: {type: str, required: true, description: "事件类型"}
      event_nature: {type: str, required: true, description: "事件性质"}
      risk_level: {type: str, required: true, description: "风险等级"}
      reason: {type: str, required: true, description: "结论理由"}
      observed_facts: {type: "list[dict]", description: "从用户事件链抽取的观测事实，不包含文档推断"}
      abnormal_triggers: {type: "list[dict]", description: "文档或内置规则中用于判断异常的触发条件"}
      trigger_match: {type: "list[dict]", description: "本次事件事实对每个异常触发条件的命中情况"}
      evidence_refs: {type: "list[dict]", description: "支撑结论的文档证据引用，包含 chunk_id、title、heading、doc_role 和 evidence_role"}
      evidence_summary: {type: str, description: "用于回答展示的证据摘要"}

  SubstationDocument:
    kind: entity
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: substation_event_kb
      id_field: document_id
    summary: "换流站专业文档"
    description: "来自 domains/substation/docs_md 的 Markdown 文档元数据，作为事件链研判的证据来源。"
    properties:
      document_id: {type: str, required: true, description: "稳定文档ID"}
      title: {type: str, description: "文档标题"}
      category: {type: str, description: "文档类别"}
      source_path: {type: str, description: "原始 PDF 路径"}
      md_path: {type: str, description: "Markdown 路径"}
      doc_role: {type: str, description: "文档角色: emergency_procedure/operation_rule/operation_ticket/control_protection_spec/equipment_overview/setting_sheet/document"}
      char_count: {type: int, description: "正文字符数"}

  EvidenceChunk:
    kind: entity
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: substation_event_kb
      id_field: chunk_id
    summary: "文档证据片段"
    description: "按标题和段落切分的证据片段，用于定位规程、处理原则、异常信号和图文线索。"
    properties:
      chunk_id: {type: str, required: true, description: "稳定片段ID"}
      document_id: {type: str, description: "所属文档ID"}
      title: {type: str, description: "所属文档标题"}
      category: {type: str, description: "文档类别"}
      md_path: {type: str, description: "Markdown 路径"}
      heading: {type: str, description: "标题层级"}
      content: {type: str, description: "片段正文"}
      evidence_role: {type: str, description: "证据角色: handling_rule/severe_signal/abnormal_signal/normal_operation/event_record/figure_context/definition"}
      image_refs: {type: str, description: "关联图片路径"}

functions:
  search_substation_evidence:
    summary: "检索换流站专业文档证据"
    description: "按关键词、文档角色和证据角色检索 Markdown 候选片段，返回压缩 snippet 和出处，不返回全文 content。它是资料定位工具，不负责组织最终答案。"
    usage_prompt: "当需要定位可能相关的文档、章节或 chunk_id 时调用。若用户要的是答案本身，如根据文档回答、解释术语、说明现象含义、判断是否异常或给出处置依据，优先调用 prepare_substation_answer_context；不要为了回答连续裸调用本工具。"
    function_type: lookup
    involves_objects: [SubstationDocument, EvidenceChunk]
    params:
      query: {type: str, description: "关键词或问题"}
      category: {type: str, description: "可选，文档类别过滤", default: ""}
      doc_role: {type: str, description: "可选，文档角色过滤", default: ""}
      evidence_role: {type: str, description: "可选，证据角色过滤", default: ""}
      limit: {type: int, description: "返回数量，默认8", default: 8}

  prepare_substation_answer_context:
    summary: "准备换流站文档问答证据包"
    description: "围绕用户问题召回、重排并压缩专业文档证据，输出适合直接回答的 evidence、出处、回答约束和证据质量提示。概念解释优先控制保护设计/说明书；异常性、风险和处置判断优先第五分册（设备异常与故障应急处理），控制保护设计文档只作为机制补充。"
    usage_prompt: "当用户要的是文档驱动的回答本身时优先调用，包括根据文档回答、是什么意思、是什么含义、意味着什么、如何理解、怎么处理、处置依据、总结依据等。调用后直接基于 evidence 和 answer_guidance 回答；只有证据片段明显不完整时才再调用 read_substation_evidence 核验原文。不要在最终回答中暴露 search_plan、工具过程或内部质量检查。"
    function_type: lookup
    involves_objects: [SubstationDocument, EvidenceChunk]
    params:
      query: {type: str, description: "用户问题"}
      category: {type: str, description: "可选，站点或文档类别过滤，如 山阳/泰州", default: ""}
      limit_evidence: {type: int, description: "返回证据条数，默认5", default: 5}

  read_substation_evidence:
    summary: "读取换流站文档上下文"
    description: "按文档ID、路径、chunk 或标题读取更完整上下文，便于核对出处。"
    usage_prompt: "当 prepare_substation_answer_context 或 search_substation_evidence 命中的片段不够完整，或需要核验某个具体 chunk 的前后文时调用。不要用它代替问答证据包工具。"
    function_type: lookup
    involves_objects: [SubstationDocument, EvidenceChunk]
    params:
      document_id: {type: str, description: "文档ID", default: ""}
      path: {type: str, description: "Markdown 路径", default: ""}
      chunk_id: {type: str, description: "片段ID", default: ""}
      heading: {type: str, description: "标题关键词", default: ""}
      max_chars: {type: int, description: "最大返回字符数", default: 6000}

  parse_substation_events:
    summary: "归一化连续事件文本"
    description: "把用户粘贴的连续事件文本转换为可研判的事件列表。不要假设输入具有固定字段格式；事件边界主要按行文中出现的事件起始时间识别，序号可有可无。工具会尽量弱抽取时间、站点、设备、事件类型、摘要和告警等级，并始终保留 raw_text。字段缺失时 raw_text 是主要事实源。"
    usage_prompt: "当用户输入连续事件并要求总结、判断异常或输出结构化结果时调用。输入可以是不严格文本；不要因为缺字段而放弃研判。"
    function_type: transform
    params:
      event_text: {type: str, description: "用户输入的事件链原文"}
      station_name: {type: str, description: "可选站点"}

  assess_substation_event_chain:
    summary: "研判连续事件链并输出结构化结论"
    description: "结合事件时间顺序、操作/保护/异常特征、告警等级和文档证据，在工具内完成事件链特征提取、证据匹配、触发条件匹配和初步结论生成。诊断依据以第五分册（设备异常与故障应急处理）为最高优先级，运行方式和控保规范用于补充说明。最终结果包含 answer_md、structured_conclusion、event_summary、feature_summary、observed_facts、abnormal_triggers、trigger_match、evidence_refs 和 evidence_summary；工具默认省略完整事件原文、case_context 和全文证据片段以降低长事件链上下文占用。trigger_match 的状态含义：matched=同类事实命中，related_but_not_matched=相关但不同类事实不能证明触发，not_matched=明确未命中，unknown=证据不足。"
    usage_prompt: "当用户给出事件链并要求总结、判断是否异常、风险多大或输出结构化结论时，优先直接调用本工具；通常不要再逐步调用 build_substation_case_context、judge_substation_case 或 format_substation_conclusion。该工具结果已经是回答包，最终回答优先直接输出 answer_md，可少量压缩但不得重写 trigger_match 的状态和依据；不要为了查看中间过程反复调用 read_tool_result。不得复述工具调用过程、工具失败、自检过程或“已确认回复完整”。回答时不得把 related_but_not_matched 写成 matched，不得把控制响应差异、录波启动、短时复归告警跨类解释为分接头不一致、保护动作或设备停运。不要只凭控保设计规范或目录页给异常性结论，不要把文档中的异常场景反推为本次事件已发生。"
    function_type: analysis
    involves_objects: [StationEvent, EventChain, EventConclusion, SubstationDocument, EvidenceChunk]
    params:
      event_text: {type: str, description: "用户输入的事件链原文", default: ""}
      events_json: {type: str, description: "已解析事件 JSON，可选", default: ""}
      evidence_query: {type: str, description: "额外证据检索关键词", default: ""}
      limit_evidence: {type: int, description: "返回证据数量", default: 8}

  build_substation_case_context:
    summary: "构建事件链研判证据包"
    description: "解析用户事件链，归一化主事件/伴随事件/异常信号，优先检索第五分册证据，再补充运行方式和控保规范，形成可供判定的 case_context。"
    usage_prompt: "事件链研判的第一步。不要直接输出最终性质判断，先构建证据包。"
    user_visible: false
    function_type: lookup
    involves_objects: [StationEvent, EventChain, SubstationDocument, EvidenceChunk]
    params:
      event_text: {type: str, description: "用户输入的事件链原文", default: ""}
      events_json: {type: str, description: "已解析事件 JSON，可选", default: ""}
      evidence_query: {type: str, description: "额外证据检索关键词", default: ""}
      limit_evidence: {type: int, description: "返回证据数量", default: 8}

  judge_substation_case:
    summary: "根据证据包判定事件链"
    description: "输入 case_context，基于事件特征与文档证据判定 event_type、event_nature、risk_level 和 reason，并输出 evidence_refs/evidence_summary 供追溯。"
    usage_prompt: "事件链研判的第二步。只接受 build_substation_case_context 的输出，不要直接把原始事件文本塞进来。"
    user_visible: false
    function_type: analysis
    involves_objects: [EventChain, EventConclusion, SubstationDocument, EvidenceChunk]
    params:
      case_context: {type: str, description: "build_substation_case_context 的 JSON 输出"}

  format_substation_conclusion:
    summary: "格式化并输出最终结论"
    description: "把判定结果整理为标准结构化结论，并生成可持久化的 EventConclusion 记录。"
    usage_prompt: "事件链研判的第三步。输出最终结构化数据，供前端展示或后续入库。"
    user_visible: false
    function_type: transform
    involves_objects: [EventConclusion]
    params:
      judgment: {type: str, description: "judge_substation_case 的 JSON 输出"}

  sync_substation_kb:
    summary: "重建换流站证据索引"
    description: "扫描 domains/substation/docs_md 下的 Markdown 文档，重建 SQLite 证据索引。"
    usage_prompt: "仅在文档更新后维护索引用。"
    user_visible: false
    function_type: lookup
    params: {}

workflows:
  event_chain_judgement:
    description: "解析事件链 -> 构建证据包 -> 基于证据包判定 -> 格式化结论"
    trigger: "用户提供连续事件并要求总结、判断是否异常或输出结构化结论"
    involves_objects: [StationEvent, EventChain, EventConclusion, SubstationDocument, EvidenceChunk]
    steps:
      - name: 解析事件链
        function: parse_substation_events
        description: "抽取事件列表和告警等级。"
        next: 构建证据包
      - name: 构建证据包
        function: build_substation_case_context
        description: "检索第五分册优先证据并补充支持材料。"
        next: 证据判定
      - name: 证据判定
        function: judge_substation_case
        description: "基于证据包形成事件性质与风险判断。"
        next: 格式化结论
      - name: 格式化结论
        function: format_substation_conclusion
        description: "生成结构化最终结论。"
        next: ""

rules:
  fifth_volume_priority:
    description: "设备异常与故障应急处理分册是诊断、异常性判断和处置建议的最高优先级知识源；控保设计规范、运行方式和设备概况只能作为补充。"
    rule_type: judgment
    applies_to: [EventConclusion, SubstationDocument, EvidenceChunk]
    result_field: reason
    source: internal

  risk_vs_nature:
    description: "event_nature 表示事件是否符合运行/保护逻辑，risk_level 表示潜在风险强度，两者可以不同。"
    rule_type: judgment
    applies_to: [EventConclusion, SubstationDocument, EvidenceChunk]
    result_field: event_nature
    source: internal

  abnormality_threshold:
    description: "出现保护动作、闭锁、跳闸、失败、停运、持续告警等后果时，性质倾向异常；仅有短时复归告警或操作伴随现象时，倾向需核查或正常。"
    rule_type: judgment
    applies_to: [SubstationDocument, EvidenceChunk]
    result_field: risk_level
    source: internal
